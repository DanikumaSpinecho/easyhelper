<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' ws: wss:; img-src 'self' blob: data:; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23ff9ec6'/%3E%3Ctext x='32' y='45' font-size='34' text-anchor='middle'%3E🌱%3C/text%3E%3C/svg%3E">
  <title>Espace technicien ♡ support.spinecho.fr</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="petals" aria-hidden="true">
  <span class="petal p1">🌸</span>
  <span class="petal p2">🌸</span>
  <span class="petal p3">🌸</span>
  <span class="petal p4">🌸</span>
  <span class="petal p5">🌸</span>
  <span class="petal p6">🌸</span>
</div>

<main class="wrap">
  <header class="hero">
    <div class="mascot-wrap">
      <svg class="mascot small" viewBox="0 0 200 240" role="img" aria-label="Radis-kun, la mascotte radis kawaii">
        <defs>
          <linearGradient id="radisBody" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff"/>
            <stop offset="0.7" stop-color="#fff7fa"/>
            <stop offset="1" stop-color="#ffd9e8"/>
          </linearGradient>
        </defs>

        <!-- étincelles -->
        <path d="M38 68 l2.8 7.5 7.5 2.8 -7.5 2.8 -2.8 7.5 -2.8 -7.5 -7.5 -2.8 7.5 -2.8 z" fill="#ffd3e4"/>
        <path d="M166 92 l2.2 6 6 2.2 -6 2.2 -2.2 6 -2.2 -6 -6 -2.2 6 -2.2 z" fill="#cdebc9"/>
        <path d="M46 112 l1.7 4.6 4.6 1.7 -4.6 1.7 -1.7 4.6 -1.7 -4.6 -4.6 -1.7 4.6 -1.7 z" fill="#fff3b0"/>

        <!-- feuilles -->
        <path d="M100 44 C 76 36 54 38 46 22 C 64 16 82 22 98 34 Z" fill="#8ED08A"/>
        <path d="M100 44 C 124 36 146 38 154 22 C 136 16 118 22 102 34 Z" fill="#8ED08A"/>
        <path d="M100 46 C 90 32 90 12 100 4 C 110 12 110 32 100 46 Z" fill="#7CC97A"/>
        <path d="M100 44 C 96 34 96 18 100 8" fill="none" stroke="#A8E6A3" stroke-width="3" stroke-linecap="round"/>

        <!-- bras -->
        <path d="M64 130 C 46 136 42 150 48 162" fill="none" stroke="#ffd3e4" stroke-width="8" stroke-linecap="round"/>
        <path d="M136 130 C 154 136 158 150 152 162" fill="none" stroke="#ffd3e4" stroke-width="8" stroke-linecap="round"/>

        <!-- corps -->
        <path d="M100 46 C 60 46 42 104 53 178 C 57 204 76 218 100 218 C 124 218 143 204 147 178 C 158 104 140 46 100 46 Z" fill="url(#radisBody)" stroke="#ffb7d5" stroke-width="3.5"/>

        <!-- joues -->
        <ellipse cx="69" cy="146" rx="10" ry="7" fill="#ffb7d5" opacity="0.85"/>
        <ellipse cx="131" cy="146" rx="10" ry="7" fill="#ffb7d5" opacity="0.85"/>

        <!-- yeux -->
        <ellipse cx="83" cy="124" rx="8.5" ry="11.5" fill="#4a3b45"/>
        <ellipse cx="117" cy="124" rx="8.5" ry="11.5" fill="#4a3b45"/>
        <circle cx="86.5" cy="119" r="3.4" fill="#ffffff"/>
        <circle cx="120.5" cy="119" r="3.4" fill="#ffffff"/>
        <circle cx="80" cy="130" r="1.7" fill="#ffffff"/>
        <circle cx="114" cy="130" r="1.7" fill="#ffffff"/>

        <!-- bouche -->
        <path d="M93 140 Q100 148 107 140" fill="none" stroke="#e75480" stroke-width="3.5" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="hero-text">
      <h1 class="kawaii-title">Espace technicien</h1>
      <p class="subtitle">꒰ ♡ ꒱ Consultation d'écran en lecture seule ꒰ ♡ ꒱</p>
      <div class="bubble bubble-green">Radis-kun te souhaite la bienvenue ♡ Saisis le code reçu par téléphone et regarde l'écran — aucune prise de contrôle possible ✨</div>
    </div>
  </header>

  <section id="login" class="card hidden">
    <form id="loginForm">
      <label for="pw">Mot de passe technicien 🔑</label>
      <input type="password" id="pw" autocomplete="current-password" required>
      <button class="primary big mt16" type="submit">Se connecter</button>
    </form>
    <p id="loginStatus" class="status hidden" role="status"></p>
  </section>

  <section id="codeEntry" class="card hidden">
    <form id="codeForm">
      <label for="code">Code de session (6 chiffres, communiqué par la personne aidée)</label>
      <input type="tel" id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="123456" autocomplete="off" required>
      <button class="primary big mt16" type="submit">Voir l'écran</button>
    </form>
    <p id="joinStatus" class="status hidden" role="status"></p>
    <button id="logoutBtn" class="ghost full mt16" type="button">Se déconnecter</button>
  </section>

  <section id="viewer" class="card hidden">
    <div class="banner live"><span class="dot"></span> Écran en direct ♡</div>
    <div class="screen"><img id="screen" alt="Écran partagé par la personne aidée"></div>
    <p id="viewerStatus" class="muted"></p>
    <button id="closeBtn" class="ghost big" type="button">Fermer la vue</button>
  </section>

  <footer>Consultation en lecture seule ♡ Aucune prise de contrôle possible.</footer>
</main>
<script src="tech.js"></script>
</body>
</html>
