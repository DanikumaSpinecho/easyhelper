<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; img-src 'self' blob: data:; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'">
  <title>Espace technicien</title>
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<main class="wrap">
  <header>
    <h1>Espace technicien</h1>
    <p>Consultation d'écran partagé, en lecture seule.</p>
  </header>

  <section id="login" class="card hidden">
    <form id="loginForm">
      <label for="pw">Mot de passe technicien</label>
      <input type="password" id="pw" autocomplete="current-password" required>
      <button class="primary big mt16" type="submit">Se connecter</button>
    </form>
    <p id="loginStatus" class="status hidden" role="status"></p>
  </section>

  <section id="codeEntry" class="card hidden">
    <form id="codeForm">
      <label for="code">Code de session (6 chiffres, communiqué par la personne aidée)</label>
      <input type="tel" id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="123456" autocomplete="off" required>
      <button class="primary big mt16" type="submit">Voir l'écran</button>
    </form>
    <p id="joinStatus" class="status hidden" role="status"></p>
    <button id="logoutBtn" class="ghost full mt16" type="button">Se déconnecter</button>
  </section>

  <section id="viewer" class="card hidden">
    <div id="liveBanner" class="banner live"><span class="dot"></span> <span id="liveBannerText">Écran en direct</span></div>
    <div id="screenBox" class="screen"><img id="screen" alt="Écran partagé par la personne aidée"></div>
    <div class="zoomBar">
      <button id="zoomOut" class="ghost zoomBtn" type="button" title="Réduire" aria-label="Réduire le zoom">−</button>
      <span id="zoomLabel" class="muted zoomLabel">100 %</span>
      <button id="zoomIn" class="ghost zoomBtn" type="button" title="Agrandir" aria-label="Agrandir le zoom">+</button>
      <button id="zoomFit" class="ghost zoomBtn" type="button" title="Revenir à la taille d'ajustement">Ajuster</button>
    </div>
    <p id="viewerStatus" class="muted"></p>
    <button id="closeBtn" class="ghost big" type="button">Fermer la vue</button>
  </section>

  <footer>
    <p class="legal">Consultation en lecture seule : aucune prise de contrôle possible.</p>
    <p class="credit">
      <a class="creditLink" href="https://github.com/DanikumaSpinecho/easyhelper" target="_blank" rel="noopener noreferrer" title="Code source (GitHub)"><svg class="ghIcon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>danikuma spinecho</a>
    </p>
  </footer>
</main>
<script src="crypto.js?v=2"></script>
<script src="tech.js?v=2"></script>
</body>
</html>
